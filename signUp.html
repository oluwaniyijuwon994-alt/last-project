<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="signUp.css" />
  </head>
  <body>
    <nav class="content1">
      <div class="content-holder1">

        <div class="content-holder2">
          <div class="Create-acc">
            <h1>Create Account</h1>
          </div>

          <div class="label-1">
            <label for="name">Full Name</label>
            <input type="text" placeholder="Enter Fullname" />
          </div>

          <div class="label-2">
            <label for="name">Email Address</label>
            <input type="email" placeholder="Enter Email Address" />
          </div>

          <div class="label-3">
            <label for="name">Password</label>
            <div class="sit-edit">
              <input
                type="name"
                class="input-3"
                id="input"
                placeholder="Enter Password"
              />
              <button id="button">Hide</button>
            </div>
          </div>

          <div class="label-4">
            <label for="name">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              placeholder="Enter Password Again"
            />
            <!-- <p id="PasswordError"></p> -->
          </div>

          <div class="label-5">
            <button></button>
            <label for="name" class="lb-5-info"
              >I agree to the terms & condition</label
            >
          </div>

          <div class="label-6">
           <a href="logOut.html"> <button>Sign Up</button></a>
             <!-- <a href="logOut.html">Sign Up</a> -->
          </div>
        </div>
      </div>
    </nav>

    <script src="signUp.js"></script>
  </body>
</html>
