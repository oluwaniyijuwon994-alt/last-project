<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="newSignIN.css" />
  </head>
  <body>
    <section class="main-holder">
      <div class="tab1">
        <div class="fst-label">
          <div>
            <img
              src="Nictorys - Factory & Industrial HTML Template/Logistics Services.svg"
              alt="img"
              width="40px"
              height="40px"
            />
          </div>

          <div class="">
            <h2>Brand</h2>
          </div>
        </div>

        <div class="snd-label-holder">
          <div class="snd-label">
            <div>
              <img
                src="Nictorys - Factory & Industrial HTML Template/1st.png"
                alt="img"
              />
            </div>

            <div class="snd-label-dash"></div>
          </div>
        </div>
      </div>

      <div class="tab2">
        <div class="tab2-info">
          <div class="welcome-form">
            <h1 class="welcome-div">Welcome Back</h1>
            <div class="welcome-dash"></div>
          </div>

          <div class="label-1">
            <label for="name" class="lb-1p">Email address</label>
            <input
              type="email"
              class="label-1-input"
              placeholder="Enter Your Email"
            />
          </div>

          <div class="label-2">
            <label for="name" class="lb-2p">Password</label>
            <div class="label-2-hidePass">
              <input
                type="text"
                id="input"
                class="label2-input"
                placeholder="Enter Your Password"
              />
              <button id="button">hide</button>
            </div>
          </div>

          <div class="label-3">
            <div class="verify-btn">
              <button class="btn-verify"></button>
              <label for="name" class="lb-3p">Remember Me</label>
            </div>
            <a href="#">forgot?</a>
          </div>

          <div class="label-4">
            <button class="sign-in">Sign In</button>
          </div>

          <div class="label-5">
            <label for="name" class="lb-4p">New here?</label>
            <a href="signUp.html">Sign Up</a>
          </div>
        </div>
      </div>
    </section>

    <script src="newSignIN.js"></script>
  </body>
</html>
